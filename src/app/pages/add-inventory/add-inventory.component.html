<div class="page">
  <header>
    <a routerLink="/" class="back">← Back</a>
    <div class="header-brand">
      <img src="images/Tonasco-logo.png" alt="Tonasco" class="brand-logo">
      <span>Jig Management</span>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="heading">
        <div>
          <p class="eyebrow">INVENTORY</p>
          <h1>Add New Jig</h1>
          <p>Add a new row directly to the Tonasco Jig Google Sheet.</p>
        </div>
      </div>

      <form (ngSubmit)="save()">
        <div class="grid">
          <label>Part Number *<input name="partNumber" [(ngModel)]="form.partNumber" required placeholder="e.g. T0017986"></label>
          <label>Register ID *<input name="registerId" [(ngModel)]="form.registerId" required placeholder="e.g. T0017986 JIG A"></label>
          <label>Machine<input name="machine" [(ngModel)]="form.machine" placeholder="e.g. CM"></label>
          <label>Bin Number<input name="binNumber" [(ngModel)]="form.binNumber" placeholder="e.g. A08"></label>
          <label>Status
            <select name="status" [(ngModel)]="form.status">
              <option>Available</option>
              <option>Taken</option>
              <option>Missing</option>
            </select>
          </label>
          <label>Who Borrow?<input name="borrower" [(ngModel)]="form.borrower" placeholder="Optional"></label>
          <label>Date Borrow<input name="dateBorrow" [(ngModel)]="form.dateBorrow" placeholder="DD/MM/YYYY"></label>
          <label>Date Return<input name="dateReturn" [(ngModel)]="form.dateReturn" placeholder="DD/MM/YYYY"></label>
        </div>

        @if (error) {
          <p style="color:#b42318; margin-top:18px;">{{ error }}</p>
        }

        @if (message) {
          <p style="color:#14734e; margin-top:18px;">{{ message }}</p>
        }

        <div class="actions">
          <a routerLink="/" class="secondary">Cancel</a>
          <button type="submit" [disabled]="saving">
            {{ saving ? 'Saving...' : 'Save Inventory' }}
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
